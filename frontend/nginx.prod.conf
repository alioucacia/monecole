# Sert les fichiers statiques du build Vite (voir Dockerfile.prod) — conteneur interne,
# jamais exposé directement : c'est nginx/nginx.conf (reverse proxy racine) qui route vers lui.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA : toute route inconnue (ex: /eleves/42) doit retomber sur index.html — c'est le
    # router côté client (React Router) qui décide quoi afficher, pas nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets Vite (hashés dans leur nom : main.a1b2c3.js) — cache long sans risque, un
    # changement de contenu change le nom de fichier.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
