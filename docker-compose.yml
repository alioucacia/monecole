version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecole_db
      POSTGRES_USER: ecole_user
      POSTGRES_PASSWORD: ecole_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 15432 côté hôte (pas 5432) : sur ce poste, 5432 ET la plage 5390-5489 (donc aussi 5433) sont
    # réservés par Windows/Hyper-V (`netsh interface ipv4 show excludedportrange protocol=tcp`),
    # Docker Desktop ne peut y publier aucun port — voir backend/.env (DATABASE_URL pointe vers
    # ce même 15432). Aucun impact à l'intérieur du réseau Docker : le service "backend"
    # ci-dessous continue de joindre celui-ci via "db:5432" (port interne au conteneur, inchangé).
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecole_user -d ecole_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=postgres://ecole_user:ecole_password@db:5432/ecole_db
      - DJANGO_ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
