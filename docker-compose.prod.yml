version: "3.9"

# Pile de production locale/staging : mêmes images que docker-compose.yml (dev), mais backend
# servi par Gunicorn (CMD par défaut de backend/Dockerfile, pas `runserver`), plusieurs réplicas
# derrière nginx, Redis pour le cache/throttling, PgBouncer pour le pooling de connexions vers
# Postgres. Voir backend/DEPLOYMENT.md pour le dimensionnement et ce qu'il reste à faire au-delà
# de cette pile mono-machine pour un débit réellement massif (LB cloud, Postgres managé avec
# réplicas de lecture, CDN...).
#
# Variables requises (pas de défaut « pratique » pour SECRET_KEY/mots de passe en prod) : copier
# backend/.env.example vers un fichier d'env dédié à la prod et le passer avec `--env-file`.
#
# Démarrage : docker compose -f docker-compose.prod.yml up --build --scale backend=3

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecole_db}
      POSTGRES_USER: ${POSTGRES_USER:-ecole_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecole_user} -d ${POSTGRES_DB:-ecole_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Pooling de connexions (mode transaction) entre Gunicorn et Postgres — nécessaire dès qu'on
  # multiplie workers × réplicas backend : chaque worker Gunicorn garde sa propre connexion
  # ouverte (CONN_MAX_AGE côté Django), ce qui sature vite max_connections de Postgres sans
  # pooler devant. Voir backend/DEPLOYMENT.md.
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ecole_user}:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ecole_db}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "20"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache Django (voir CACHES dans settings.py) et backend du throttling DRF — partagé entre
  # tous les réplicas backend, contrairement au cache mémoire local utilisé en dev.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # Pas de `command:` ici, contrairement à docker-compose.yml (dev) : on garde le CMD Gunicorn
    # par défaut de backend/Dockerfile.
    volumes:
      # Partagé entre tous les réplicas — un fichier uploadé (logo, photo) doit être visible
      # quel que soit le réplica qui sert la requête suivante.
      - media_data:/app/media
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY:?définir SECRET_KEY (longue valeur aléatoire, distincte du dev)}
      - DATABASE_URL=postgres://${POSTGRES_USER:-ecole_user}:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-ecole_db}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:?définir DJANGO_ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?définir CORS_ALLOWED_ORIGINS}
      - FRONTEND_URL=${FRONTEND_URL:?définir FRONTEND_URL}
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:?définir BACKEND_PUBLIC_URL}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
      - WEB_THREADS=${WEB_THREADS:-4}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `docker compose -f docker-compose.prod.yml up --scale backend=N` fait tourner N réplicas
    # — c'est le vrai levier de débit (voir backend/DEPLOYMENT.md), pas le nombre de workers
    # Gunicorn à lui seul.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Figé dans le JS au build (voir frontend/Dockerfile.prod) — pas une variable d'env
        # lue au démarrage du conteneur, contrairement à celles du service `backend`.
        VITE_API_URL: "${VITE_API_URL:?définir VITE_API_URL, ex. https://api.taly-school.com/api}"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  media_data:
