worker_processes auto;

events {
    worker_connections 4096;
}

http {
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Résolveur Docker embarqué (127.0.0.11) : permet à nginx de re-résoudre le nom `backend`
    # à chaque requête plutôt qu'une seule fois au démarrage, et donc de voir tous les
    # conteneurs du service une fois scalé (`docker compose -f docker-compose.prod.yml up
    # --scale backend=N`). C'est une répartition round-robin approximative, pas un vrai load
    # balancer (pas de retrait automatique d'un réplica en panne, pas de pondération) —
    # suffisant pour mesurer un gain en local/staging, pas pour la production réelle. Voir
    # backend/DEPLOYMENT.md pour ce qu'il faut à la place (load balancer cloud managé).
    resolver 127.0.0.11 valid=10s;

    # api.<domaine> : API Django (voir docker-compose.prod.yml, service `backend`).
    server {
        listen 80;
        server_name api.taly-school.com;

        location / {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }

    # <domaine> (+ www) : frontend statique (voir docker-compose.prod.yml, service `frontend` —
    # build de frontend/Dockerfile.prod, nginx interne servant les fichiers Vite compilés).
    server {
        listen 80 default_server;
        server_name taly-school.com www.taly-school.com;

        location / {
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
