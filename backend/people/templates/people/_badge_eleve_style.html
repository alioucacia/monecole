<style>
    /* La carte élève est une image unique dessinée par people/carte_eleve.py (format portrait
       54 × 85,6 mm, carte PVC CR80) : ce style ne fait que la poser sur la page.

       Page A4 (pas une page à la taille exacte de la carte) : un format de page minuscule
       s'imprime de façon imprévisible selon le lecteur PDF ou l'imprimante — la carte garde ses
       dimensions réelles, centrée sur une A4, prête à découper/plastifier. Pour une impression
       directe sur carte PVC, voir EleveBadgeViewSet.pdf_pvc (reportlab).

       Pièges xhtml2pdf : largeurs en mm (jamais en %) et aucun padding horizontal sur une <td>
       (il s'ajoute à la largeur déclarée). Partagé par badge_eleve_pdf.html (carte seule) et
       badges_classe_pdf.html (planche d'une classe). */
    @page { size: A4; margin: 0; }
    html, body { margin: 0; padding: 0; }
    body { font-family: Helvetica, Arial, sans-serif; }

    table.page { width: 210mm; }
    .page td { padding: 0; }

    img.carte { width: 54mm; height: 85.6mm; }

    /* Planche d'une classe : 9 cartes par page A4, 3 colonnes x 3 lignes.
       Largeur : 18 + 54 + 6 + 54 + 6 + 54 + 18 = 210 mm.
       Hauteur : 12 + 3 x 85,6 + 3 x 5 = 283,8 mm (< 297 mm). */
    table.grille { width: 210mm; }
    .grille td { padding: 0; }
    .grille .marge-page { width: 18mm; }
    .grille .marge-haut { height: 12mm; }
    .grille .carte-cell { width: 54mm; vertical-align: top; }
    .grille .colonne-gap { width: 6mm; }
    .grille .ligne-gap { height: 5mm; }
</style>
